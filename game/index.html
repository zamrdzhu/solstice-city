<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Alba — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  .hud-topleft { position: absolute; top: 14px; left: 16px; }
  .hud-stars { font-size: 26px; letter-spacing: 4px; color: #ffd23e; }
  .hud-health { width: 220px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 5px; margin-top: 6px; overflow: hidden; }
  .hud-healthbar { height: 100%; width: 100%; background: #58d68d; }
  .hud-money { font-size: 22px; font-weight: 700; margin-top: 6px; color: #7dff9e; }
  .hud-mission { margin-top: 12px; background: rgba(0,0,0,.55); border-left: 4px solid #ffd23e; padding: 8px 12px; max-width: 330px; border-radius: 4px; }
  .hud-mission-name { font-weight: 800; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .hud-mission-objective { font-size: 13px; margin-top: 2px; color: #dfe6ee; }
  .hud-mission-extra { font-size: 13px; margin-top: 2px; color: #ffd23e; font-weight: 700; }
  .hud-topright { position: absolute; top: 14px; right: 16px; text-align: right; }
  .hud-clock { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .hud-weather { font-size: 15px; font-weight: 700; margin-top: 4px; color: #bfe3ff; }
  .hud-radio { font-size: 13px; margin-top: 4px; color: #ffd28e; }
  .hud-mapwrap { position: absolute; left: 16px; bottom: 16px; }
  .hud-minimap { border-radius: 50%; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 12px rgba(0,0,0,.6); background: #22303a; }
  .hud-dialogue { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(560px, 56vw); display: none; background: rgba(0,0,0,.72); border-radius: 8px; padding: 12px 16px; font-size: 16px; line-height: 1.45; gap: 8px; }
  .hud-dialogue-speaker { font-weight: 800; white-space: nowrap; }
  .hud-hint { position: absolute; right: 16px; bottom: 16px; font-size: 11px; color: rgba(238,241,245,.75); text-align: right; max-width: 300px; }
  .hud-flash { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 30px; font-weight: 800; letter-spacing: 2px; text-align: center; color: #ffd23e; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .hud-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,10,18,.45); pointer-events: auto; }
  .hud-panel { background: rgba(10,16,26,.88); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 34px 44px; text-align: center; max-width: 560px; box-shadow: 0 12px 50px rgba(0,0,0,.6); }
  .hud-title { margin: 0 0 8px; font-size: 46px; letter-spacing: 6px; color: #ffd23e; }
  .hud-title.wasted { color: #ff5a4e; }
  .hud-subtitle { font-size: 15px; line-height: 1.5; color: #dfe6ee; margin: 0 0 20px; }
  .hud-button { display: block; width: 100%; margin: 8px 0; padding: 12px 20px; font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #0e1420; background: #ffd23e; border: none; border-radius: 8px; cursor: pointer; }
  .hud-button:hover { background: #ffe27a; }
  .hud-controls { font-size: 12px; color: #9fb0c0; line-height: 1.6; margin: 18px 0 0; }
  .hud-note { font-size: 11px; color: #7d8b9b; margin: 10px 0 0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Costa Alba: an open-world crime game. Drive, explore the city, take on missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
